<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Sensible main screen sketch</title>
  <rect width="960" height="720" fill="#FFFFFF"/>
  <g fill="none" stroke="#14213D" stroke-width="2" stroke-dasharray="6 4">
    <rect x="16" y="16" width="168" height="688" rx="8"/>
  </g>
  <g fill="#14213D" font-size="14">
    <text x="32" y="44" font-weight="700">Sidebar</text>
    <text x="32" y="74">Month picker</text>
    <text x="32" y="98">Account filter</text>
    <text x="32" y="122">Savings goal $</text>
    <text x="32" y="160" font-weight="700">AI rules</text>
    <text x="32" y="184" font-size="12">1. Use my numbers</text>
    <text x="32" y="202" font-size="12">2. Never move money</text>
    <text x="32" y="220" font-size="12">3. No stock picks</text>
    <text x="32" y="238" font-size="12">4. No card numbers</text>
    <text x="32" y="256" font-size="12">5. Say "I don't know"</text>
  </g>

  <!-- Header -->
  <text x="204" y="50" font-size="30" font-weight="700" fill="#14213D">Sensible</text>
  <text x="204" y="74" font-size="14" fill="#14213D">Cents &amp; Sensibility · Your money, finally making sense.</text>

  <!-- Account summary tiles -->
  <g stroke="#2EC4B6" stroke-width="2" fill="#F1F5F9">
    <rect x="204" y="92" width="174" height="74" rx="8"/>
    <rect x="390" y="92" width="174" height="74" rx="8"/>
    <rect x="576" y="92" width="174" height="74" rx="8"/>
    <rect x="762" y="92" width="182" height="74" rx="8"/>
  </g>
  <g fill="#14213D" font-size="13">
    <text x="216" y="116">ACCOUNT SUMMARY</text><text x="216" y="148" font-size="20" font-weight="700">Net worth</text>
    <text x="402" y="116">This month</text><text x="402" y="148" font-size="20" font-weight="700">Spent ▲ %</text>
    <text x="588" y="116">This month</text><text x="588" y="148" font-size="20" font-weight="700">Income</text>
    <text x="774" y="116">Recurring</text><text x="774" y="148" font-size="20" font-weight="700">Subscriptions</text>
  </g>

  <!-- Spending chart -->
  <rect x="204" y="182" width="440" height="190" rx="8" fill="none" stroke="#14213D" stroke-width="2"/>
  <text x="218" y="208" font-size="16" font-weight="700" fill="#14213D">Where the money went (chart)</text>
  <g fill="#2EC4B6">
    <rect x="300" y="226" width="300" height="18"/><rect x="300" y="252" width="290" height="18"/>
    <rect x="300" y="278" width="130" height="18"/><rect x="300" y="304" width="90" height="18"/>
    <rect x="300" y="330" width="60" height="18"/>
  </g>
  <g fill="#14213D" font-size="12">
    <text x="218" y="240">Shopping</text><text x="218" y="266">Housing</text><text x="218" y="292">Dining</text>
    <text x="218" y="318">Groceries</text><text x="218" y="344">Coffee</text>
  </g>

  <!-- Alerts -->
  <rect x="658" y="182" width="286" height="190" rx="8" fill="none" stroke="#FF6B6B" stroke-width="3"/>
  <text x="672" y="208" font-size="16" font-weight="700" fill="#14213D">ALERTS</text>
  <rect x="672" y="222" width="4" height="54" fill="#FF6B6B"/>
  <text x="684" y="240" font-size="13" font-weight="700" fill="#14213D">ElectroMart $489.99</text>
  <text x="684" y="262" font-size="12" fill="#14213D">new merchant, 11x usual</text>
  <rect x="672" y="290" width="4" height="54" fill="#FF6B6B"/>
  <text x="684" y="308" font-size="13" font-weight="700" fill="#14213D">Capital Grille $186.40</text>
  <text x="684" y="330" font-size="12" fill="#14213D">12x usual dining</text>

  <!-- Ask AI -->
  <rect x="204" y="388" width="740" height="130" rx="8" fill="none" stroke="#2EC4B6" stroke-width="3"/>
  <text x="218" y="414" font-size="16" font-weight="700" fill="#14213D">ASK AI (Money Brain)</text>
  <g fill="#F1F5F9" stroke="#14213D">
    <rect x="218" y="426" width="210" height="28" rx="14"/><rect x="438" y="426" width="230" height="28" rx="14"/>
    <rect x="678" y="426" width="252" height="28" rx="14"/>
  </g>
  <g fill="#14213D" font-size="12">
    <text x="232" y="445">Where did my money go?</text><text x="452" y="445">How much on subscriptions?</text>
    <text x="692" y="445">Anything weird on my card?</text>
  </g>
  <rect x="218" y="466" width="712" height="36" rx="6" fill="#FFFFFF" stroke="#14213D"/>
  <text x="230" y="489" font-size="13" fill="#94A3B8">Type a question...</text>

  <!-- Accounts / subscriptions / goal -->
  <g fill="none" stroke="#14213D" stroke-width="2">
    <rect x="204" y="534" width="300" height="80" rx="8"/>
    <rect x="516" y="534" width="210" height="80" rx="8"/>
    <rect x="738" y="534" width="206" height="80" rx="8"/>
  </g>
  <g fill="#14213D" font-size="14" font-weight="700">
    <text x="218" y="558">Accounts table</text><text x="530" y="558">Subscriptions</text><text x="752" y="558">Savings goal</text>
  </g>
  <rect x="752" y="576" width="178" height="12" rx="6" fill="#F1F5F9"/>
  <rect x="752" y="576" width="116" height="12" rx="6" fill="#2EC4B6"/>

  <!-- Transactions -->
  <rect x="204" y="630" width="740" height="74" rx="8" fill="none" stroke="#14213D" stroke-width="2"/>
  <text x="218" y="654" font-size="16" font-weight="700" fill="#14213D">TRANSACTIONS LIST</text>
  <text x="218" y="680" font-size="12" fill="#14213D">Date · Merchant · Category · Account · Amount   (filter by category, search merchant)</text>
</svg>
